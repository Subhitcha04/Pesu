[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008"]   # FastAPI's File()/Form() defaults are the documented pattern

[tool.ruff.lint.per-file-ignores]
"scripts/gen_screenshots.py" = ["E702", "E501"]   # one UI step per line reads better there

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--ignore=tests/e2e"
filterwarnings = ["ignore::DeprecationWarning:starlette.*"]
